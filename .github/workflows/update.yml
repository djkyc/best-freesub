name: Update Subscriptions

on:
  schedule:
    # 每 3 小时整点自动触发运行一次
    - cron: '0 */3 * * *'
  workflow_dispatch:  # 仅保留手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            # 先拉取远程最新变动并变基合并，避免 reject
            git pull origin main --rebase || true
            git push origin main
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"

      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'EOF'
          import os
          import json
          import urllib.request
          import urllib.parse

          token = os.environ.get("TG_BOT_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          job_status = os.environ.get("JOB_STATUS")

          if not token or not chat_id:
              print("[-] Telegram Secrets 未配置，跳过通知发送。")
              exit(0)

          total = 0
          residential = 0
          filtered_risk = 0
          residential_mobile = 0
          normal_cdn = 0

          try:
              with open("output/e2e_test_report.json", "r", encoding="utf-8") as f:
                  report = json.load(f)
                  # 打印出完整的 JSON 结构，方便在 Action 日志中查看真实的 Key 名字
                  print("[DEBUG] e2e_test_report.json content:", json.dumps(report, ensure_ascii=False, indent=2))
                  
                  # 尽可能多地罗列常见可能的键名变体
                  total = (report.get("total") or report.get("total_nodes") or 
                           report.get("count") or report.get("sum") or 0)
                  
                  residential = (report.get("residential") or report.get("residential_count") or 
                                 report.get("home_broadband") or 0)
                  
                  filtered_risk = (report.get("filtered_risk") or report.get("risk_removed") or 
                                   report.get("filtered_high_risk") or report.get("removed_risk") or 0)
                  
                  residential_mobile = (report.get("residential_mobile") or report.get("residential_or_mobile") or 
                                        report.get("res_mobile") or 0)
                  
                  normal_cdn = (report.get("normal_cdn") or report.get("normal_count") or 
                                report.get("datacenter_cdn") or report.get("normal") or 0)
          except Exception as e:
              print(f"[!] 读取测试报告 JSON 失败: {e}")

          status_icon = "✅ 成功" if job_status == "success" else "❌ 失败"

          msg = (
              f"<b>📢 Best-Freesub订阅更新: {status_icon}</b>\n"
              f"━━━━━━━━━━━━━━━━━━━\n"
              f"📊 <b>全量节点:</b> <code>{total}</code>\n"
              f"🏠 <b>家宽节点:</b> <code>{residential}</code>\n"
              f"🛡️ <b>劫持高风险节点已剔除:</b> <code>{filtered_risk}</code>\n"
              f"📶 <b>家宽/移动网络节点:</b> <code>{residential_mobile}</code>\n"
              f"💻 <b>普通(机房/CDN):</b> <code>{normal_cdn}</code>\n"
              f"━━━━━━━━━━━━━━━━━━━"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "HTML"
          }).encode("utf-8")

          try:
              req = urllib.request.Request(url, data=data, method="POST")
              with urllib.request.urlopen(req) as response:
                  print("[+] Telegram 通知发送成功。")
          except Exception as e:
              print(f"[-] Telegram 通知发送失败: {e}")
          EOF
