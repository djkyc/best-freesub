name: Update Subscriptions

on:
  schedule:
    # 每 3 小时整点自动触发运行一次
    - cron: '0 */3 * * *'
  workflow_dispatch:  # 仅保留手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          # 运行脚本并将标准输出和错误同时重定向到 run.log，并实时打印在控制台
          python scripts/main_v2.py 2>&1 | tee run.log
        env:
          # 便于 ip-api 等识别限速; GitHub runner 出口为美国 Azure
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            # 先拉取远程最新变动并变基合并，避免 reject
            git pull origin main --rebase || true
            git push origin main
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"

      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'EOF'
          import os
          import re
          import urllib.request
          import urllib.parse

          token = os.environ.get("TG_BOT_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          job_status = os.environ.get("JOB_STATUS")

          if not token or not chat_id:
              print("[-] Telegram Secrets 未配置，跳过通知发送。")
              exit(0)

          total = 0
          residential = 0
          filtered_risk = 0
          residential_mobile = 0
          normal_cdn = 0

          log_path = "run.log"
          if os.path.exists(log_path):
              try:
                  with open(log_path, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()

                      # 提取 劫持高风险节点已剔除
                      match_risk = re.search(r"MITM\s+劫持高风险节点已剔除[^\d]*(\d+)", content)
                      if match_risk:
                          filtered_risk = int(match_risk.group(1))

                      # 提取 家宽/移动网络节点 与 普通节点
                      match_net = re.search(r"家宽/移动网络节点[^\d]*(\d+)\s*\|\s*普通\(机房/CDN\)[^\d]*(\d+)", content)
                      if match_net:
                          residential_mobile = int(match_net.group(1))
                          normal_cdn = int(match_net.group(2))

                      # 提取 导出完毕 全量 与 家宽
                      match_total = re.search(r"导出完毕[^\d]*全量[^\d]*(\d+)\s*\|\s*家宽[^\d]*(\d+)", content)
                      if match_total:
                          total = int(match_total.group(1))
                          residential = int(match_total.group(2))
              except Exception as e:
                  print(f"[!] 解析日志出错: {e}")
          else:
              print(f"[!] 未找到日志文件 {log_path}")

          status_icon = "✅ 成功" if job_status == "success" else "❌ 失败"

          msg = (
              f"<b>📢 Best-Freesub订阅更新: {status_icon}</b>\n"
              f"━━━━━━━━━━━━━━━━━━━\n"
              f"📊 <b>全量节点:</b> <code>{total}</code>\n"
              f"🏠 <b>家宽节点:</b> <code>{residential}</code>\n"
              f"🛡️ <b>劫持高风险节点已剔除:</b> <code>{filtered_risk}</code>\n"
              f"📶 <b>家宽/移动网络节点:</b> <code>{residential_mobile}</code>\n"
              f"💻 <b>普通(机房/CDN):</b> <code>{normal_cdn}</code>\n"
              f"━━━━━━━━━━━━━━━━━━━"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "HTML"
          }).encode("utf-8")

          try:
              req = urllib.request.Request(url, data=data, method="POST")
              with urllib.request.urlopen(req
