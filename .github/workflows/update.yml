name: Update Subscriptions

on:
  schedule:
    # 每 3 小时整点自动触发运行一次
    - cron: '0 */12 * * *'
  workflow_dispatch:  # 仅保留手动触发按钮

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Run Real-Prober and Classifier (sing-box v1.14 全协议)
        run: |
          python scripts/main_v2.py 2>&1 | tee run.log
        env:
          PYTHONUNBUFFERED: '1'

      - name: Upload test artifacts (调试用, 7天保留)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: |
            output/e2e_test_report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/ README.md
          if git diff --staged --quiet; then
            echo "没有节点变动与内容更新。"
          else
            git commit -m "Auto Update: $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
            git pull origin main --rebase || true
            git push origin main
          fi

      - name: Purge jsDelivr CDN (post-push)
        if: success()
        run: |
          REPO="${GITHUB_REPOSITORY}"
          p() { curl -s -o /dev/null "https://purge.jsdelivr.net/gh/${REPO}@main/$1" || true; }
          p README.md
          for f in v2ray.txt clash.yaml singbox.json residential.txt residential-clash.yaml residential-singbox.json; do
            p "output/$f"
          done
          find output/residential-by-country output/by-country -type f 2>/dev/null | while read -r f; do
            p "$f"; sleep 0.2
          done
          echo "[+] jsDelivr CDN purge done (after push)"

      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python - << 'EOF'
          import os
          import re
          import html
          import urllib.request
          import urllib.parse

          token = os.environ.get("TG_BOT_TOKEN")
          chat_id = os.environ.get("TG_CHAT_ID")
          job_status = os.environ.get("JOB_STATUS")

          if not token or not chat_id:
              print("[-] Telegram Secrets 未配置，跳过通知发送。")
              exit(0)

          total = 0
          residential = 0
          filtered_risk = 0
          residential_mobile = 0
          normal_cdn = 0

          log_path = "run.log"
          if os.path.exists(log_path):
              try:
                  with open(log_path, "r", encoding="utf-8", errors="ignore") as f:
                      content = f.read()

                      match_risk = re.search(r"MITM\s+劫持高风险节点已剔除[^\d]*(\d+)", content)
                      if match_risk:
                          filtered_risk = int(match_risk.group(1))

                      match_net = re.search(r"家宽/移动网络节点[^\d]*(\d+)\s*\|\s*普通\(机房/CDN\)[^\d]*(\d+)", content)
                      if match_net:
                          residential_mobile = int(match_net.group(1))
                          normal_cdn = int(match_net.group(2))

                      match_total = re.search(r"导出完毕[^\d]*全量[^\d]*(\d+)\s*\|\s*家宽[^\d]*(\d+)", content)
                      if match_total:
                          total = int(match_total.group(1))
                          residential = int(match_total.group(2))
              except Exception as e:
                  print(f"[!] 解析日志出错: {e}")

          # 家宽地区：按 output/residential-by-country/<CC>.txt 统计，文件名即国家/地区代码
          CC_NAMES = {
              "HK": "中国香港", "TW": "中国台湾", "MO": "中国澳门",
              "JP": "日本", "KR": "韩国", "SG": "新加坡", "MY": "马来西亚",
              "TH": "泰国", "VN": "越南", "ID": "印度尼西亚", "PH": "菲律宾",
              "IN": "印度", "AE": "阿联酋", "IL": "以色列", "TR": "土耳其",
              "US": "美国", "CA": "加拿大", "MX": "墨西哥", "BR": "巴西",
              "CL": "智利", "AR": "阿根廷",
              "GB": "英国", "DE": "德国", "FR": "法国", "NL": "荷兰",
              "PL": "波兰", "IT": "意大利", "ES": "西班牙", "SE": "瑞典",
              "NO": "挪威", "FI": "芬兰", "CH": "瑞士", "AT": "奥地利",
              "CZ": "捷克", "RO": "罗马尼亚", "BG": "保加利亚",
              "RU": "俄罗斯", "UA": "乌克兰", "BY": "白俄罗斯",
              "KZ": "哈萨克斯坦", "AU": "澳大利亚", "NZ": "新西兰",
              "ZA": "南非", "SC": "塞舌尔", "IR": "伊朗",
              "AL": "阿尔巴尼亚", "CY": "塞浦路斯", "LT": "立陶宛",
              "LV": "拉脱维亚",
          }
          region_counts = {}
          res_dir = "output/residential-by-country"
          try:
              if os.path.isdir(res_dir):
                  for fn in sorted(os.listdir(res_dir)):
                      if not fn.endswith(".txt") or fn.startswith(("clash-", "singbox-")):
                          continue
                      cc = fn[:-4].upper()
                      with open(os.path.join(res_dir, fn), "r", encoding="utf-8", errors="ignore") as f:
                          raw = f.read().strip()
                      # 分地区 .txt 是 base64 订阅（单行），直接数行会永远是 1，必须解码后再数节点
                      if "://" in raw:
                          n = sum(1 for line in raw.splitlines() if line.strip())
                      else:
                          try:
                              import base64
                              decoded = base64.b64decode(raw + "=" * (-len(raw) % 4)).decode("utf-8", "ignore")
                              n = sum(1 for line in decoded.splitlines() if line.strip())
                          except Exception:
                              n = sum(1 for line in raw.splitlines() if line.strip())
                      if n:
                          name = CC_NAMES.get(cc, cc)
                          region_counts[name] = region_counts.get(name, 0) + n
          except Exception as e:
              print(f"[!] 统计家宽地区出错: {e}")
          if not region_counts and residential:
              # 兜底：分地区文件缺失时，从 residential.txt 的节点名里取地区
              try:
                  import base64
                  with open("output/residential.txt", "r", encoding="utf-8", errors="ignore") as f:
                      raw = f.read().strip()
                  decoded = base64.b64decode(raw + "=" * (-len(raw) % 4)).decode("utf-8", "ignore")
                  for line in decoded.splitlines():
                      if "#" not in line:
                          continue
                      name = urllib.parse.unquote(line.rsplit("#", 1)[1]).strip()
                      name = re.sub(r"^[^\u4e00-\u9fa5A-Za-z]+", "", name)
                      region = re.split(r"[\s(（]", name, maxsplit=1)[0]
                      if region:
                          region_counts[region] = region_counts.get(region, 0) + 1
              except Exception as e:
                  print(f"[!] 从 residential.txt 解析地区出错: {e}")
          if region_counts:
              region_text = "、".join(f"{name}×{n}" if n > 1 else name for name, n in region_counts.items())
          elif residential:
              region_text = "未知"
          else:
              region_text = "无"

          status_icon = "✅ 成功" if job_status == "success" else "❌ 失败"

          msg = (
              f"<b>📢 Best-Freesub-djkyc订阅更新: {status_icon}</b>\n"
              f"━━━━━━━━━━━━━━━━━━━\n"
              f"📊 <b>全量节点:</b> <code>{total}</code>\n"
              f"🏠 <b>家宽节点:</b> <code>{residential}</code>\n"
              f"🌍 <b>家宽地区:</b> <code>{html.escape(region_text)}</code>\n"
              f"🛡️ <b>劫持高风险节点已剔除:</b> <code>{filtered_risk}</code>\n"
              f"📶 <b>家宽/移动网络节点:</b> <code>{residential_mobile}</code>\n"
              f"💻 <b>普通(机房/CDN):</b> <code>{normal_cdn}</code>\n"
              f"━━━━━━━━━━━━━━━━━━━"
          )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": msg,
              "parse_mode": "HTML"
          }).encode("utf-8")

          try:
              req = urllib.request.Request(url, data=data, method="POST")
              with urllib.request.urlopen(req) as response:
                  print("[+] Telegram 通知发送成功。")
          except Exception as e:
              print(f"[-] Telegram 通知发送失败: {e}")
          EOF
